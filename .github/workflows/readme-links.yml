name: README links

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/check_readme_links.py"
      - ".github/workflows/readme-links.yml"
  pull_request:
    paths:
      - "README.md"
      - "scripts/check_readme_links.py"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — profile badges rot quietly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check README links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe every external link
        run: python3 scripts/check_readme_links.py README.md
